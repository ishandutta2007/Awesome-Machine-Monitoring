<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Linear Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Text & Elements -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heavyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Wave, Pulsing Gauges, and Telemetry Signals */
    .wave-line-1 {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: dash 8s linear infinite, pulseOpacity 4s ease-in-out infinite alternate;
    }
    .wave-line-2 {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 12s linear infinite reverse;
    }
    .pulse-dot {
      animation: pulseRadius 2.5s ease-in-out infinite alternate;
    }
    .rotating-gear-cw {
      transform-origin: 1050px 100px;
      animation: rotateCW 20s linear infinite;
    }
    .rotating-gear-ccw {
      transform-origin: 1130px 170px;
      animation: rotateCCW 15s linear infinite;
    }
    .scan-line {
      animation: scan 6s ease-in-out infinite alternate;
    }
    .status-ping {
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .float-badge {
      animation: float 5s ease-in-out infinite alternate;
    }

    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0.2; }
    }
    @keyframes pulseOpacity {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }
    @keyframes pulseRadius {
      0% { r: 4px; opacity: 0.6; }
      100% { r: 8px; opacity: 1; }
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Base Background & Grid -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="150" cy="100" r="180" fill="#06b6d4" opacity="0.08" filter="url(#heavyGlow)" />
  <circle cx="1050" cy="300" r="220" fill="#3b82f6" opacity="0.1" filter="url(#heavyGlow)" />
  <circle cx="600" cy="380" r="150" fill="#10b981" opacity="0.06" filter="url(#heavyGlow)" />

  <!-- DYNAMIC BACKGROUND / SIDE ELEMENTS (Does NOT overlap foreground title text) -->

  <!-- Industrial Gear Aesthetics (Top Right Decorative) -->
  <g opacity="0.25">
    <!-- Gear 1 -->
    <g class="rotating-gear-cw">
      <path d="M1050 70 L1050 130 M1020 100 L1080 100 M1029 79 L1071 121 M1029 121 L1071 79" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
      <circle cx="1050" cy="100" r="30" fill="#0f172a" stroke="#06b6d4" stroke-width="4"/>
      <circle cx="1050" cy="100" r="12" fill="#06b6d4"/>
    </g>
    <!-- Gear 2 -->
    <g class="rotating-gear-ccw">
      <path d="M1130 140 L1130 200 M1100 170 L1160 170 M1109 149 L1151 191 M1109 191 L1151 149" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <circle cx="1130" cy="170" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="1130" cy="170" r="8" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Telemetry Waveforms (Bottom Background Layer) -->
  <g opacity="0.6">
    <!-- Oscilloscope Grid Box at Bottom Right -->
    <path d="M 100 320 Q 300 240, 500 310 T 900 270 T 1150 330" fill="none" stroke="url(#cyanGlow)" stroke-width="3" class="wave-line-1" filter="url(#glowShadow)"/>
    <path d="M 50 340 Q 250 380, 450 300 T 850 340 T 1180 290" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" class="wave-line-2"/>

    <!-- Pulse Points along the Telemetry Wave -->
    <circle cx="500" cy="310" r="6" fill="#06b6d4" class="pulse-dot" filter="url(#glowShadow)"/>
    <circle cx="900" cy="270" r="6" fill="#38bdf8" class="pulse-dot" filter="url(#glowShadow)"/>
  </g>

  <!-- Dynamic Vertical Radar Scan Bar in Background -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="url(#emeraldGlow)" stroke-width="2" class="scan-line" opacity="0.4"/>

  <!-- Tech Corner Accents -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top-Left Bracket -->
    <path d="M 30 60 L 30 30 L 60 30" />
    <!-- Top-Right Bracket -->
    <path d="M 1170 60 L 1170 30 L 1140 30" />
    <!-- Bottom-Left Bracket -->
    <path d="M 30 340 L 30 370 L 60 370" />
    <!-- Bottom-Right Bracket -->
    <path d="M 1170 340 L 1170 370 L 1140 370" />
  </g>

  <!-- Live Status Badge (Top Left Corner) -->
  <g transform="translate(60, 55)" class="float-badge">
    <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <circle cx="20" cy="16" r="9" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#10b981" letter-spacing="1">SYSTEM ONLINE</text>
  </g>

  <!-- Metric Badges (Top Right Corner) -->
  <g transform="translate(860, 55)" class="float-badge">
    <!-- Badge 1: OEE -->
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
    <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">OEE: <tspan fill="#06b6d4">98.4%</tspan></text>
    
    <!-- Badge 2: PdM AI -->
    <rect x="130" y="0" width="140" height="32" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
    <text x="142" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">HEALTH: <tspan fill="#a78bfa">OPTIMAL</tspan></text>
  </g>

  <!-- FOREGROUND LAYER: MAIN TITLE & SUBTITLE (High Contrast & Clear Readability) -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <!-- Icon / Symbol above Title -->
    <g transform="translate(0, -65)">
      <!-- Central Glowing Gear/Sensor Icon -->
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="3" filter="url(#glowShadow)"/>
      <path d="M-10 -2 L0 -12 L10 -2 M0 -12 L0 10 M-8 6 L8 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title -->
    <text x="0" y="15" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="46" 
          font-weight="800" 
          fill="url(#titleGrad)" 
          letter-spacing="-0.5"
          filter="url(#glowShadow)">
      Awesome Machine Monitoring
    </text>

    <!-- Subtitle -->
    <text x="0" y="55" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="url(#subTitleGrad)" 
          letter-spacing="0.2">
      Industrial IoT • Predictive Maintenance (PdM) • OEE Analytics • Machine Health
    </text>

    <!-- Decorative Accent Pill Under Subtitle -->
    <rect x="-120" y="78" width="240" height="4" rx="2" fill="url(#cyanGlow)" filter="url(#glowShadow)"/>
  </g>

</svg>
